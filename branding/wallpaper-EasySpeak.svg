<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <!-- Deep dark OS background -->
  <rect width="100%" height="100%" fill="#0b0f19"/>

  <defs>
    <!-- Vibrant Blue/Cyan Gradients -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    
    <!-- Subtle glow for the boot screen pop -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Central Logo Group -->
  <g transform="translate(960, 460)">
    <!-- Abstract speech bubble ring -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="url(#primaryGradient)" stroke-width="12" filter="url(#glow)"/>
    
    <!-- Tail of the speech bubble -->
    <path d="M 80,80 L 140,140 L 40,110 Z" fill="url(#primaryGradient)" />

    <!-- Animated sound waves inside -->
    <rect x="-45" y="-40" width="16" height="80" rx="8" fill="#ffffff" />
    <rect x="-10" y="-70" width="16" height="140" rx="8" fill="#ffffff" />
    <rect x="25" y="-20" width="16" height="40" rx="8" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <text x="960" y="700" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    EasySpeak<tspan fill="#4facfe">OS</tspan>
  </text>
</svg>
