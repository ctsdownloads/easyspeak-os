# Manual test build of a live ISO. Run it from the Actions tab, or:  gh workflow run build-iso.yml
name: Build live ISO (test)
on:
  workflow_dispatch:

jobs:
  iso:
    name: Build live ISO
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Build the live variant of the image
        run: sudo podman build --cap-add sys_admin --security-opt label=disable --squash -t localhost/easyspeak-os-live -f iso/Containerfile iso

      - name: Build the ISO
        id: build
        uses: ublue-os/titanoboa@main   # not pinned: an experiment, per the project's README
        with:
          image-ref: localhost/easyspeak-os-live

      - name: Checksum
        run: |
          mkdir -p output
          mv "${{ steps.build.outputs.iso-dest }}" output/easyspeak-os-live.iso
          (cd output && sha256sum easyspeak-os-live.iso | tee easyspeak-os-live.iso.sha256)

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: easyspeak-os-live-iso
          path: output/
