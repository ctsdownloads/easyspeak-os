version = 1
SPDX-PackageName = "EasySpeakOS"
SPDX-PackageSupplier = "Matt Hartley <matt@matthartley.com>"
SPDX-PackageDownloadLocation = "https://github.com/ctsdownloads/easyspeak-os"

# Everything is GPL-3.0-or-later unless a rule below says otherwise.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Matt Hartley"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Files that started from Universal Blue's image template (github.com/ublue-os/image-template), which is
# Apache-2.0. They keep that license, with this project's changes under it too.
[[annotations]]
path = [
    "Justfile",
    "Containerfile",
    "artifacthub-repo.yml",
    "image-template.env",
    ".gitignore",
    "disk_config/**",
    ".github/dependabot.yml",
    ".github/renovate.json5",
    ".github/workflows/build.yml",
    ".github/workflows/build-disk.yml",
]
precedence = "override"
SPDX-FileCopyrightText = ["Universal Blue contributors", "2026 Matt Hartley"]
SPDX-License-Identifier = "Apache-2.0"

# The live-ISO build, based on the Bazzite example in Universal Blue's titanoboa (github.com/ublue-os/titanoboa),
# which is Apache-2.0. It keeps that license, with this project's changes under it too.
[[annotations]]
path = ["iso/Containerfile", "iso/src/**"]
precedence = "override"
SPDX-FileCopyrightText = ["Universal Blue contributors", "2026 Matt Hartley"]
SPDX-License-Identifier = "Apache-2.0"

# The EasySpeakOS installer on the live USB is this project's own work, not from titanoboa: GPL-3.0-or-later.
[[annotations]]
path = [
    "iso/src/easyspeak-os-installer/**",
    "iso/src/easyspeak-os-install-engine",
    "iso/src/io.github.ctsdownloads.EasySpeakOS.Installer.desktop",
    "iso/src/io.github.ctsdownloads.easyspeak-os.install.policy",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Matt Hartley"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The Ready Dot GNOME Shell extension runs inside GNOME Shell (GPL-2.0-or-later), so it uses that license.
[[annotations]]
path = "system_files/usr/share/gnome-shell/extensions/ready-dot@easyspeak-os/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Matt Hartley"
SPDX-License-Identifier = "GPL-2.0-or-later"
