label: "EasySpeakOS-Live"
grub2:
  timeout: 10
  entries:
    - name: "EasySpeakOS Live"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=EasySpeakOS-Live enforcing=0 rd.live.image"
      initrd: "/images/pxeboot/initrd.img"
    - name: "EasySpeakOS Live (basic graphics)"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=EasySpeakOS-Live enforcing=0 rd.live.image nomodeset"
      initrd: "/images/pxeboot/initrd.img"
