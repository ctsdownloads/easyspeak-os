# Installer (Anaconda) settings for EasySpeakOS. The installer picks this file because os-release says
# ID=easyspeak-os. It works like Fedora Silverblue's, which it is based on, without Fedora's name.

[Profile]
profile_id = easyspeak-os
base_profile = fedora-silverblue

[Profile Detection]
os_id = easyspeak-os

[User Interface]
# Silverblue's stylesheet comes with Fedora's logos, which this system does not have.
custom_stylesheet =
hidden_webui_pages =
    root-password

[Localization]
# Don't ask Fedora's location service for the time zone; the installer offers a list instead.
use_geolocation = False
