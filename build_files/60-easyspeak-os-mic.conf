# EasySpeakOS: a microphone with no saved volume starts at 50% instead of WirePlumber's 100%, which is often too loud
# for speech recognition. WirePlumber keeps volumes cubed, as GNOME's slider shows them: 0.5 x 0.5 x 0.5 = 0.125 is
# 50% on the slider. A volume someone has set is kept.
wireplumber.settings = {
  device.routes.default-source-volume = 0.125
}
